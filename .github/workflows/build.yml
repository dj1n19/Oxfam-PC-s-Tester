name: build

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  # Portable Linux build: one lazy-djin-tester-x86_64.AppImage file.
  # An AppImage runs only on systems at least as new as the one it was built
  # on (glibc), so: the oldest Ubuntu runner (22.04 = Linux Mint 21) and the
  # Qt 6.8 binaries from qt.io (apt on 22.04 only has Qt 6.2).
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia'
          cache: true
      - name: Install dependencies
        # libxcb-*: Qt's X11 plugin; libpulse0: audio. They end up inside the AppImage.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libpulse0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      # Linux Mint does not install smartmontools: ship smartctl, like on Windows.
      # Static, so the single file also runs as root outside the AppImage (pkexec).
      - name: Build a static smartctl
        run: |
          curl -fsSLO https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.tar.gz
          echo "690b83ca331378da9ea0d9d61008c4b22dde391387b9bbad7f29387f2595f76e  smartmontools-7.5.tar.gz" | sha256sum -c
          tar xf smartmontools-7.5.tar.gz
          cd smartmontools-7.5
          ./configure LDFLAGS=-static --without-libsystemd --without-selinux --without-libcap-ng
          make -j"$(nproc)" smartctl
          strip smartctl
          file smartctl | grep -q "statically linked"
          ./smartctl --version
      # linuxdeploy copies the Qt libraries and plugins the app needs into
      # AppDir, then packs AppDir into one file. Versions pinned + checked.
      - name: Make the AppImage
        run: |
          mkdir -p AppDir/usr/bin/tools
          cp build/lazy-djin-tester config/thresholds.json config/keyboard_layout.json AppDir/usr/bin/
          cp smartmontools-7.5/smartctl tools/README.md AppDir/usr/bin/tools/
          cp src/ui/icons/djinn-256.png lazy-djin-tester.png
          cat > lazy-djin-tester.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Lazy Djin's Tester
          Comment=Check a refurbished PC before sale
          Exec=lazy-djin-tester
          Icon=lazy-djin-tester
          Categories=System;
          Terminal=false
          EOF
          # linuxdeploy's own AppRun starts the program through a symlink at the
          # AppDir root; recent Qt then takes THAT folder as applicationDirPath()
          # and finds neither qt.conf (plugins) nor thresholds.json nor tools/
          # (seen with Arch's Qt: "no Qt platform plugin could be initialized").
          cat > AppRun.sh <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/lazy-djin-tester" "$@"
          EOF
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          EOF
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/lazy-djin-tester \
            --desktop-file lazy-djin-tester.desktop --icon-file lazy-djin-tester.png \
            --custom-apprun AppRun.sh --plugin qt --output appimage
          ls -l lazy-djin-tester-x86_64.AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1          # the runner has no FUSE to mount AppImages
          OUTPUT: lazy-djin-tester-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-djin-tester-linux
          path: lazy-djin-tester-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Stage portable folder
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/lazy-djin-tester.exe dist/
          Copy-Item config/thresholds.json dist/
          Copy-Item config/keyboard_layout.json dist/
          windeployqt --release dist/lazy-djin-tester.exe
          # The UAC manifest must be embedded, otherwise SMART silently needs "Run as administrator"
          if (-not (Select-String -Path dist/lazy-djin-tester.exe -Pattern requireAdministrator -SimpleMatch -Quiet)) {
            throw "requireAdministrator manifest missing from lazy-djin-tester.exe"
          }
      # smartctl is a separate GPL program, shipped next to the app (see tools/README.md)
      - name: Bundle smartctl
        run: |
          choco install smartmontools -y --no-progress
          New-Item -ItemType Directory dist/tools | Out-Null
          Copy-Item "$env:ProgramFiles/smartmontools/bin/smartctl.exe" dist/tools/
          Copy-Item tools/README.md dist/tools/
          dist/tools/smartctl.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-djin-tester-windows
          path: dist
