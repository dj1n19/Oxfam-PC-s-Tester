name: build

on: [push, pull_request]

# apt must never wait for an answer: nobody is there to type it. On
# 2026-10-26 the linux job hung in "Install dependencies" until cancelled,
# twice, with no log at all. (2026-10-27, with a log: not a hang, a very
# slow mirror; see the linux job.) DEBIAN_FRONTEND is set after sudo, on the
# command itself: sudo drops the environment by default.

jobs:
  # The version shown in the window title and in every run report: the tag
  # name for a tagged push (v1.0.0-beta.1), else dev-<commit>.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30          # a normal run takes 2-5 min; GitHub's default is 6 h
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 10        # stopped by the runner = log kept (a cancelled run had none)
        run: |
          sudo apt-get update
          # The Azure mirror sometimes sends a few kB/s (2026-10-27: 57 packages
          # in 10 min, then stopped). Recommended packages are not needed to
          # build (qt6-multimedia-dev recommends GStreamer, Intel video drivers...):
          # far fewer downloads. A failed download is tried again.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            ninja-build qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  # Portable Linux build: one lazy-djin-tester-x86_64.AppImage file.
  # An AppImage runs only on systems at least as new as the one it was built
  # on (glibc), so: the oldest Ubuntu runner (22.04 = Linux Mint 21) and the
  # Qt 6.8 binaries from qt.io (apt on 22.04 only has Qt 6.2).
  appimage:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30          # a normal run takes 2-5 min; GitHub's default is 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia'
          cache: true
      - name: Install dependencies
        timeout-minutes: 10        # stopped by the runner = log kept (a cancelled run had none)
        # libxcb-*: Qt's X11 plugin; libpulse0: audio. They end up inside the AppImage.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libpulse0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAPP_VERSION=${{ needs.version.outputs.value }}"
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      # Linux Mint does not install smartmontools: ship smartctl, like on Windows.
      # Static, so the single file also runs as root outside the AppImage (pkexec).
      - name: Build a static smartctl
        run: |
          curl -fsSLO https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.tar.gz
          echo "690b83ca331378da9ea0d9d61008c4b22dde391387b9bbad7f29387f2595f76e  smartmontools-7.5.tar.gz" | sha256sum -c
          tar xf smartmontools-7.5.tar.gz
          cd smartmontools-7.5
          ./configure LDFLAGS=-static --without-libsystemd --without-selinux --without-libcap-ng
          make -j"$(nproc)" smartctl
          strip smartctl
          file smartctl | grep -q "statically linked"
          ./smartctl --version
      # linuxdeploy copies the Qt libraries and plugins the app needs into
      # AppDir, then packs AppDir into one file. Versions pinned + checked.
      - name: Make the AppImage
        run: |
          mkdir -p AppDir/usr/bin/tools
          cp build/lazy-djin-tester AppDir/usr/bin/   # config/ is outside, in the package (job "package")
          cp smartmontools-7.5/smartctl tools/README.md AppDir/usr/bin/tools/
          cp src/ui/icons/djinn-256.png lazy-djin-tester.png
          cat > lazy-djin-tester.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Lazy Djin's Tester
          Comment=Check a refurbished PC before sale
          Exec=lazy-djin-tester
          Icon=lazy-djin-tester
          Categories=System;
          Terminal=false
          EOF
          # linuxdeploy's own AppRun starts the program through a symlink at the
          # AppDir root; recent Qt then takes THAT folder as applicationDirPath()
          # and finds neither qt.conf (plugins) nor tools/
          # (seen with Arch's Qt: "no Qt platform plugin could be initialized").
          cat > AppRun.sh <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/lazy-djin-tester" "$@"
          EOF
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          EOF
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/lazy-djin-tester \
            --desktop-file lazy-djin-tester.desktop --icon-file lazy-djin-tester.png \
            --custom-apprun AppRun.sh --plugin qt --output appimage
          ls -l lazy-djin-tester-x86_64.AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1          # the runner has no FUSE to mount AppImages
          OUTPUT: lazy-djin-tester-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-djin-tester-linux
          path: lazy-djin-tester-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30          # a normal run takes 2-5 min; GitHub's default is 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 "-DAPP_VERSION=${{ needs.version.outputs.value }}"
      - name: Build
        run: cmake --build build --config Release
      - name: Stage portable folder
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/lazy-djin-tester.exe dist/
          windeployqt --release dist/lazy-djin-tester.exe
          # The UAC manifest must be embedded, otherwise SMART silently needs "Run as administrator"
          if (-not (Select-String -Path dist/lazy-djin-tester.exe -Pattern requireAdministrator -SimpleMatch -Quiet)) {
            throw "requireAdministrator manifest missing from lazy-djin-tester.exe"
          }
      # smartctl is a separate GPL program, shipped next to the app (see tools/README.md).
      # Taken from the official installer (same version as the AppImage), opened with
      # 7-Zip instead of installed: no Chocolatey (its feed failed twice with 406).
      # bin/ = 64-bit, bin32/ = 32-bit.
      - name: Bundle smartctl
        run: |
          curl.exe -fsSLO https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.win32-setup.exe
          if ((Get-FileHash smartmontools-7.5.win32-setup.exe -Algorithm SHA256).Hash -ne '896337FCC253220614CF8CDBD5CF2321C5AA326A37A04160A672A281E6104C70') {
            throw "smartmontools installer: wrong SHA-256"
          }
          7z x -osmartmontools -y smartmontools-7.5.win32-setup.exe bin/smartctl.exe
          if ($LASTEXITCODE -ne 0) { throw "7z could not extract smartctl.exe" }
          New-Item -ItemType Directory dist/tools | Out-Null
          Copy-Item smartmontools/bin/smartctl.exe dist/tools/
          Copy-Item tools/README.md dist/tools/
          dist/tools/smartctl.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-djin-tester-windows
          path: dist

  # What the technicians get: one "Lazy Djin's Tester" folder for both systems.
  #   app/              Windows program (dist/ above) + the AppImage + start-linux.sh
  #   config/           read by the program from here (see core/ProgramFolder.h)
  #   delivery-sheets/  EMPTY: the real sheets hold operators' names, never in
  #                     this public repository. Put them in before sharing.
  #   two launchers + LISEZMOI.txt (from .github/package/)
  # logs/ is made by the program on its first run (a zip keeps no empty folder:
  # delivery-sheets/ holds a short note for the same reason).
  package:
    needs: [version, windows, appimage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lazy-djin-tester-windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: lazy-djin-tester-linux
          path: linux
      - name: Assemble the folder
        run: |
          ROOT="package/Lazy Djin's Tester"
          mkdir -p "$ROOT/app" "$ROOT/config" "$ROOT/delivery-sheets"
          cp -r windows/. "$ROOT/app/"
          cp linux/lazy-djin-tester-x86_64.AppImage .github/package/start-linux.sh "$ROOT/app/"
          cp config/thresholds.json config/keyboard_layout.json config/tests.json "$ROOT/config/"
          cp ".github/package/Lazy Djin's Tester (Windows).cmd" \
             ".github/package/Lazy Djin's Tester (Linux).desktop" \
             .github/package/LISEZMOI.txt "$ROOT/"
          cp .github/package/delivery-sheets.txt "$ROOT/delivery-sheets/LISEZMOI.txt"
          find package -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-djin-tester-${{ needs.version.outputs.value }}
          path: package
