name: build

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Stage portable folder
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/oxfam-tester.exe dist/
          Copy-Item config/thresholds.json dist/
          Copy-Item config/keyboard_layout.json dist/
          windeployqt --release dist/oxfam-tester.exe
          # The UAC manifest must be embedded, otherwise SMART silently needs "Run as administrator"
          if (-not (Select-String -Path dist/oxfam-tester.exe -Pattern requireAdministrator -SimpleMatch -Quiet)) {
            throw "requireAdministrator manifest missing from oxfam-tester.exe"
          }
      # smartctl is a separate GPL program, shipped next to the app (see tools/README.md)
      - name: Bundle smartctl
        run: |
          choco install smartmontools -y --no-progress
          New-Item -ItemType Directory dist/tools | Out-Null
          Copy-Item "$env:ProgramFiles/smartmontools/bin/smartctl.exe" dist/tools/
          Copy-Item tools/README.md dist/tools/
          dist/tools/smartctl.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: oxfam-tester-windows
          path: dist
